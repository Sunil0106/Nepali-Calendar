<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nepali Calendar with Bikram Sambat dates, festivals, holidays, tithi, and a simple modern interface.">
    <link rel="stylesheet" href="./stylesheets/css/style.css" />
    <link rel="shortcut icon" href="favicon/f2.png" type="image/x-icon">
    <title>बुढी पात्रो</title>
  </head>
  <body>
    <main>
      <div class="app-container">
        <div class="title">बुढी &dash; नेपाली पात्रो</div>
        <div class="calender-header">
          <button class="previous-month js-previous-month-button">
            <i class="bi bi-chevron-left"></i>
          </button>
          <button class="js-jump-today-date">
            <i class="bi bi-calendar-heart"></i>
            <span class="date-today js-date-today-display">
              १० असोज २०८३, शनिवार</span
            >
          </button>
          <button class="next-month js-next-month-button">
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>
        <div class="calender-grid js-calender-grid">  
      </div>
      <div class="events-container js-display-events-container"></div>
    </main>
    <script src="./script.js" type="module"></script>
  </body>
</html>
